# ============================================================================
# Research Copilot · Nginx 反向代理（生产）
#
# 挂载方式（见 docker-compose.prod.yml）：
#   ./deploy/nginx/research-copilot.conf : /etc/nginx/conf.d/default.conf:ro
# 覆盖官方镜像自带的 default.conf；基础 nginx.conf 的
# `include /etc/nginx/conf.d/*.conf` 照常生效，不需要改基础配置。
#
# 默认只开 80：HTTP 直连即可跑通（隧道 / 内网演示都够用）。
# 要上 HTTPS：见同目录 ../HTTPS.md，把下面「HTTPS」小节取消注释并挂证书。
# ============================================================================

# WebSocket / SSE 的 Connection 头需要动态取，否则 SSE 会被降级成短连接
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 后端（compose 服务名）
upstream rc_backend {
    server backend:8000;
    keepalive 32;
}

# 前端（Nuxt nitro node server）
upstream rc_frontend {
    server frontend:3000;
    keepalive 16;
}

# ---------------------------------------------------------------- 日志格式
log_format rc_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"rt":$request_time,"ua":"$http_user_agent","xff":"$http_x_forwarded_for"}';

server {
    listen 80;
    server_name _;

    # PDF 上传：默认 1m 会把大论文顶回来。后端另有一层大小校验，这里是传输层上限。
    client_max_body_size 200m;

    # 生产访问日志落盘中转，便于容器外部采集（同目录另有 Docker json-file 轮转）
    access_log /var/log/nginx/access.log rc_json;
    error_log  /var/log/nginx/error.log warn;

    # ---- ACME 挑战目录（签发/续期证书时用）----
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- 后端 API ----
    # 一个 location 覆盖全部 /api/ ：SSE（/qa/stream、/tools/explore、/chat/*）
    # 必须关缓冲，否则事件会被 Nginx 攒着一次性吐出，前端看不到流式轨迹。
    location /api/ {
        proxy_pass http://rc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;          # ★ SSE 关键
        proxy_cache off;
        proxy_read_timeout 600s;      # 长检索 / 长综述，别 60s 掐断
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ---- Nginx 自身存活探针（不经过后端，供 compose healthcheck 用）----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- 后端健康检查（给负载均衡 / 探活用）----
    location = /health {
        proxy_pass http://rc_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- MCP 端点（Agent 侧 MultiServerMCPClient 连这里）----
    location /mcp {
        proxy_pass http://rc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ---- 前端（Nuxt）----
    location / {
        proxy_pass http://rc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # ---- 评审访问门禁（可选）----
    # 本系统没有登录体系，「评审专用账号」落到网关层做是最省的做法：一段 Basic Auth。
    # 生成口令文件（用户名 reviewer，密码交互输入）：
    #   docker run --rm httpd:2.4-alpine htpasswd -nbB reviewer '你的密码' > deploy/nginx/htpasswd
    # 然后取消下面三行注释 + 在 docker-compose.prod.yml 的 nginx.volumes 里加：
    #   - ./deploy/nginx/htpasswd:/etc/nginx/htpasswd:ro
    # 注意：Basic Auth 会一并挡掉 /api/（前端拿不到数据），这正是「只有评审能看」的效果；
    # 但健康探针 /healthz 必须放行，否则 compose 会把 nginx 判死。
    # auth_basic           "Research Copilot · 评审访问";
    # auth_basic_user_file /etc/nginx/htpasswd;
    # 如果只想挡前端页面、放行 API（例如前端需要在无凭据下拿静态资源）：
    #   location /api/ { auth_basic off; ...上面的 API 配置... }

    # 压缩：SSE/EventStream 不能压，其余按类型开
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}

