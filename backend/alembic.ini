# Alembic configuration.
#
# NOTE: this file must stay pure ASCII. Alembic reads it with the platform
# "locale" encoding (see alembic/util/compat.read_config_parser), which is GBK
# on Chinese Windows -- any non-ASCII comment here makes `alembic upgrade`
# die with UnicodeDecodeError before it ever reaches the migration.
#
# sqlalchemy.url is intentionally empty: alembic/env.py pulls it from
# app.core.config.settings so the connection string (with password) never
# lands in version control.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped revision filenames keep the versions/ directory sortable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
# Escaped: configparser BasicInterpolation would reject a bare "%H"
datefmt = %%H:%%M:%%S
